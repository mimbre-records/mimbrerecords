<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mimbre Records - Transmisión colectiva de frecuencias urbanas.">
    <meta name="keywords" content="Mimbre Records, Vía Luma, Alto Ruido, música urbana chilena, trap, cosmosemiótica">
    <meta name="author" content="Mimbre Records">

    <meta property="og:title" content="Mimbre Records">
    <meta property="og:description" content="Transmisión colectiva de frecuencias urbanas">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mimbrerecords.cl">
    <meta property="og:image" content="assets/VL-AR-album.png">

    <link rel="icon" href="favicon.ico">

    <title>Mimbre Records</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->
    <header class="hero">
        <div class="hero-grain"></div>

        <svg class="greca greca-top" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
            <path class="greca-path" d="M0,20 L20,20 L20,5 L40,5 L40,35 L60,35 L60,20 L80,20 L80,5 L100,5 L100,35 L120,35 L120,20 L140,20 L140,5 L160,5 L160,35 L180,35 L180,20 L200,20 L200,5 L220,5 L220,35 L240,35 L240,20 L260,20 L260,5 L280,5 L280,35 L300,35 L300,20 L320,20 L320,5 L340,5 L340,35 L360,35 L360,20 L380,20 L380,5 L400,5" />
        </svg>

        <div class="hero-inner reveal">
            <img src="assets/MM-logo.png" alt="Mimbre Records" class="logo-mimbre">
            <h1 class="brand-title">MIMBRE<span>RECORDS</span></h1>
            <p class="eyebrow">Sello independiente — Chile</p>
        </div>

        <a href="#seam" class="scroll-cue" aria-label="Bajar">
            <span></span>
        </a>
    </header>

    <!-- SEAM: la imagen que es el concepto -->
    <section class="seam" id="seam" aria-label="Alto Ruido — arte del lanzamiento">
        <div class="seam-image-wrap">
            <img src="assets/VL-AR-album.png" alt="Mural geométrico agrietando un muro de concreto, un árbol crece desde la grieta" class="seam-image" id="seamImage">
        </div>
        <div class="seam-overlay"></div>
        <p class="seam-caption reveal">Lo ancestral, creciendo en el concreto.</p>
    </section>

    <!-- LANZAMIENTO -->
    <main>
        <section class="release" id="release">
            <div class="release-header reveal">
                <img src="assets/VL-logo.png" alt="Vía Luma" class="logo-artist">
                <p class="release-eyebrow">Primer lanzamiento</p>
                <h2 class="release-title">ALTO RUIDO</h2>
            </div>

            <div class="album-card reveal" id="albumCard">
                <img src="assets/VL-AR-album.png" alt="Alto Ruido — portada del álbum" class="album-cover" id="albumCover">
            </div>

            <div class="listen-block reveal">
                <div id="spotify-embed" class="spotify-embed">
                    <iframe
                        data-testid="embed-iframe"
                        style="border-radius:12px"
                        src="https://open.spotify.com/embed/artist/6UHhm198iprKdfDYM6poIf?utm_source=generator&theme=0&si=eed9112bffdc47ad"
                        width="100%"
                        height="352"
                        frameborder="0"
                        allowfullscreen=""
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                        loading="lazy">
                    </iframe>
                </div>

                <div class="cta-band">
                    <div class="release-links">
                        <a href="https://open.spotify.com/artist/6UHhm198iprKdfDYM6poIf?si=y51wFvBURNeQi3a_nKCDkA"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="btn btn-primary"
                           aria-label="Escuchar Vía Luma en Spotify">
                            Escuchar en Spotify
                        </a>

                        <button
                            type="button"
                            class="btn btn-ghost"
                            id="share-spotify-btn"
                            aria-label="Compartir link de Spotify"
                            data-share-url="https://open.spotify.com/artist/6UHhm198iprKdfDYM6poIf?si=y51wFvBURNeQi3a_nKCDkA">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                            Compartir
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <svg class="greca greca-mid reveal" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
            <path class="greca-path" d="M0,20 L20,20 L20,5 L40,5 L40,35 L60,35 L60,20 L80,20 L80,5 L100,5 L100,35 L120,35 L120,20 L140,20 L140,5 L160,5 L160,35 L180,35 L180,20 L200,20 L200,5 L220,5 L220,35 L240,35 L240,20 L260,20 L260,5 L280,5 L280,35 L300,35 L300,20 L320,20 L320,5 L340,5 L340,35 L360,35 L360,20 L380,20 L380,5 L400,5" />
        </svg>

        <section class="metrics reveal" aria-label="Datos de transmisión">
            <p class="metrics-text" id="metricsText" data-full="RC: 0.72 | INR: 0.2 | LF: 0.58"></p>
        </section>
    </main>

    <footer class="footer reveal">
        <a href="https://instagram.com/mimbre.records"
           target="_blank"
           rel="noopener noreferrer"
           class="footer-link"
           aria-label="Instagram Mimbre Records">
            @mimbre.records
        </a>

        <p class="contact-email">
            Te escuchamos —
            <a href="mailto:mimbre.records@gmail.com">mimbre.records@gmail.com</a>
        </p>

        <p class="footer-fine">Mimbre Records © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
