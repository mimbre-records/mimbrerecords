<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mimbre Records - Transmisión colectiva de frecuencias urbanas.">
    <meta name="keywords" content="Mimbre Records, Vía Luma, Alto Ruido, música urbana chilena, trap, cosmosemiótica">
    <meta name="author" content="Mimbre Records">

    <meta property="og:title" content="Mimbre Records">
    <meta property="og:description" content="Transmisión colectiva de frecuencias urbanas">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mimbrerecords.cl">

    <title>Mimbre Records</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="geometric-canvas"></canvas>

    <main class="container">

        <header class="header">
            <img src="assets/MM-logo.png" alt="Mimbre Records Logo" class="logo-main">
        </header>

        <section class="identity">
            <h1 class="title">MIMBRE RECORDS</h1>
            <p class="subtitle">Transmisión colectiva</p>
        </section>

        <section class="release">
            <div class="release-header">
                <img src="assets/VL-logo.png" alt="Vía Luma Logo" class="logo-artist">
                <h2 class="release-title">VÍA LUMA</h2>
            </div>

            <div class="album">
                <img src="assets/VL-AR-album.png" alt="Alto Ruido - Portada" class="album-cover">
                <h3 class="album-title">Alto Ruido</h3>
            </div>

            <!-- Imagen promo sobre el embed -->
            <div class="promo-image-wrap">
                <img src="assets/imagen-alto-ruido-concreto.png" alt="Alto Ruido - Promo" class="promo-image">
            </div>

            <!-- Spotify embed -->
            <div id="spotify-embed" class="spotify-embed">
                <iframe
                    data-testid="embed-iframe"
                    style="border-radius:12px"
                    src="https://open.spotify.com/embed/artist/6UHhm198iprKdfDYM6poIf?utm_source=generator&theme=0&si=eed9112bffdc47ad"
                    width="100%"
                    height="352"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

                <div class="release-links">
                    <a href="https://open.spotify.com/artist/6UHhm198iprKdfDYM6poIf?si=y51wFvBURNeQi3a_nKCDkA"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="social-link spotify-link"
                       aria-label="Escuchar Vía Luma en Spotify">
                        Escuchar en Spotify
                    </a>

                    <button
                        type="button"
                        class="share-button"
                        id="share-spotify-btn"
                        aria-label="Compartir link de Spotify"
                        data-share-url="https://open.spotify.com/artist/6UHhm198iprKdfDYM6poIf?si=y51wFvBURNeQi3a_nKCDkA">
                        Compartir
                    </button>
                </div>
            </div>
        </section>

        <section class="metrics">
            <p class="metrics-text">RC: 0.72 | INR: 0.2 | LF: 0.58</p>
        </section>

        <footer class="footer">
            <a href="https://instagram.com/mimbrerecords"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link"
               aria-label="Instagram Mimbre Records">
                @mimbrerecords
            </a>

            <p class="contact-email">
                Contacto y verificación de artista:
                <a href="mailto:mimbre.records@gmail.com">mimbre.records@gmail.com</a>
            </p>
        </footer>

    </main>

    <script src="script.js"></script>
    <script>
        const shareBtn = document.getElementById('share-spotify-btn');
        if (shareBtn) {
            shareBtn.addEventListener('click', async () => {
                const url = shareBtn.getAttribute('data-share-url');
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Vía Luma - Mimbre Records',
                            text: 'Escucha Vía Luma en Spotify',
                            url: url
                        });
                    } catch (err) {}
                } else {
                    try {
                        await navigator.clipboard.writeText(url);
                        shareBtn.textContent = 'Copiado';
                        setTimeout(() => { shareBtn.textContent = 'Compartir'; }, 1500);
                    } catch (err) {}
                }
            });
        }
    </script>
</body>
</html>
